<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>AutoDraw Local</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f2ec;
      --surface: #fffefb;
      --surface-strong: #ffffff;
      --ink: #17212b;
      --muted: #6f7a81;
      --line: #d9d8d1;
      --line-strong: #b9bbb7;
      --accent: #007f7a;
      --accent-soft: #dcefed;
      --coral: #d45443;
      --gold: #d9a323;
      --blue: #2f6da1;
      --shadow: 0 14px 36px rgba(31, 42, 48, 0.12);
      --header-height: 60px;
      --suggestion-height: 118px;
      --toolbar-width: 58px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      min-width: 320px;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input { font: inherit; letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid rgba(0, 127, 122, 0.28);
      outline-offset: 2px;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: var(--header-height) var(--suggestion-height) minmax(0, 1fr);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 251, 0.96);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: max-content;
      color: var(--ink);
      font-weight: 760;
      font-size: 16px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--ink);
      color: #fffefb;
    }

    .mode-label {
      min-width: 0;
      padding: 5px 9px;
      border: 1px solid #b7d8d5;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #05645f;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .runtime-status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 163, 35, 0.14);
    }

    .runtime-status.ready .status-dot {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 127, 122, 0.13);
    }

    .runtime-status.error .status-dot {
      background: var(--coral);
      box-shadow: 0 0 0 3px rgba(212, 84, 67, 0.13);
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
    }

    .icon-button:hover { background: #eeede7; border-color: var(--line); }
    .icon-button:disabled { color: #afb4b5; cursor: default; background: transparent; border-color: transparent; }

    .suggestion-rail {
      min-width: 0;
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .suggestion-heading {
      align-self: center;
      padding-left: 2px;
    }

    .suggestion-heading strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--ink);
    }

    .suggestion-heading span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .suggestion-list {
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
      padding: 1px 2px 5px;
    }

    .suggestion-placeholder {
      min-width: 86px;
      height: 90px;
      border: 1px dashed var(--line);
      border-radius: 7px;
      background: #faf9f5;
    }

    .suggestion-button {
      width: 88px;
      height: 92px;
      flex: 0 0 88px;
      display: grid;
      grid-template-rows: 61px 1fr;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-strong);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }

    .suggestion-button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 5px 14px rgba(34, 63, 68, 0.1);
    }

    .suggestion-button img {
      width: 100%;
      height: 61px;
      padding: 9px;
      object-fit: contain;
      background:
        linear-gradient(45deg, #f6f5ef 25%, transparent 25%),
        linear-gradient(-45deg, #f6f5ef 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f6f5ef 75%),
        linear-gradient(-45deg, transparent 75%, #f6f5ef 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }

    .suggestion-button span {
      overflow: hidden;
      padding: 5px 6px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--toolbar-width) minmax(0, 1fr);
    }

    .toolbar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 8px;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .tool-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .tool-button.active {
      border-color: #9ccbc7;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tool-button:hover:not(:disabled) { border-color: var(--line); background: #f0efe9; }
    .tool-button:disabled { color: #b7babb; cursor: default; }
    .toolbar-divider { width: 28px; height: 1px; margin: 2px 0; background: var(--line); }
    .toolbar-spacer { flex: 1; }

    .canvas-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      background:
        radial-gradient(circle at 18px 18px, rgba(23, 33, 43, 0.045) 1px, transparent 1.5px) 0 0 / 20px 20px,
        var(--page);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 180px;
      overflow: hidden;
      border: 1px solid #d2d1cb;
      border-radius: 8px;
      background:
        linear-gradient(rgba(33, 49, 58, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(33, 49, 58, 0.035) 1px, transparent 1px),
        #fff;
      background-size: 28px 28px;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .drawing-canvas,
    .placed-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .placed-layer { pointer-events: none; z-index: 1; }
    .placed-icon { position: absolute; object-fit: contain; user-select: none; }

    .drawing-canvas {
      z-index: 2;
      cursor: crosshair;
      touch-action: none;
    }

    .style-dock {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100% - 48px);
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 254, 251, 0.94);
      box-shadow: 0 9px 24px rgba(26, 38, 45, 0.12);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
    }

    .swatches { display: flex; gap: 5px; }

    .swatch {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 2px solid var(--surface-strong);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px var(--line-strong);
      cursor: pointer;
    }

    .swatch.active { box-shadow: 0 0 0 2px var(--surface-strong), 0 0 0 4px var(--accent); }

    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .size-control input { width: 112px; accent-color: var(--accent); }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: min(320px, calc(100% - 36px));
      padding: 10px 13px;
      border-radius: 7px;
      background: var(--ink);
      color: white;
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.visible { opacity: 1; transform: translateY(0); }
    svg { display: block; }

    @media (max-width: 720px) {
      :root { --header-height: 54px; --suggestion-height: 108px; --toolbar-width: 50px; }
      .app-header { gap: 8px; padding: 0 9px; }
      .brand span { display: none; }
      .brand-mark { width: 34px; height: 34px; }
      .mode-label { display: none; }
      .runtime-status { flex: 1; }
      .suggestion-rail { grid-template-columns: 72px minmax(0, 1fr); padding: 8px; }
      .suggestion-button { width: 80px; height: 82px; flex-basis: 80px; grid-template-rows: 54px 1fr; }
      .suggestion-button img { height: 54px; padding: 7px; }
      .suggestion-placeholder { min-width: 78px; height: 80px; }
      .toolbar { padding: 7px 5px; }
      .tool-button { width: 38px; height: 38px; }
      .canvas-shell { padding: 8px; }
      .style-dock { bottom: 18px; gap: 8px; max-width: calc(100% - 24px); padding: 7px 9px; }
      .size-control input { width: 76px; }
    }

    @media (max-height: 560px) {
      :root { --suggestion-height: 96px; }
      .suggestion-button { height: 72px; grid-template-rows: 48px 1fr; }
      .suggestion-button img { height: 48px; padding: 6px; }
      .suggestion-placeholder { height: 70px; }
      .style-dock { bottom: 16px; }
    }

    @media (max-height: 380px) {
      :root { --header-height: 48px; --suggestion-height: 80px; }
      .suggestion-heading span { display: none; }
      .suggestion-button { height: 58px; grid-template-rows: 38px 1fr; }
      .suggestion-button img { height: 38px; padding: 4px; }
      .suggestion-placeholder { height: 56px; }
      .stage { min-height: 120px; }
      .canvas-shell { padding: 6px; }
      .style-dock { bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand" aria-label="AutoDraw Local">
        <div class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h4l10.7-10.7a2.1 2.1 0 0 0-4-4L4 16v4Z"/>
            <path d="m13.5 6.5 4 4"/>
          </svg>
        </div>
        <span>AutoDraw Local</span>
      </div>
      <span class="mode-label">AutoDraw</span>
      <div class="runtime-status" id="runtimeStatus" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="runtimeStatusText">Loading model</span>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="downloadButton" type="button" title="Download SVG" aria-label="Download SVG" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
      </div>
    </header>

    <section class="suggestion-rail" aria-label="Drawing suggestions">
      <div class="suggestion-heading">
        <strong>Suggestions</strong>
        <span id="suggestionState">Model loading</span>
      </div>
      <div class="suggestion-list" id="suggestionList">
        <div class="suggestion-placeholder" aria-hidden="true"></div>
        <div class="suggestion-placeholder" aria-hidden="true"></div>
        <div class="suggestion-placeholder" aria-hidden="true"></div>
        <div class="suggestion-placeholder" aria-hidden="true"></div>
        <div class="suggestion-placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <main class="workspace">
      <aside class="toolbar" aria-label="Drawing tools">
        <button class="tool-button active" type="button" title="AutoDraw pen" aria-label="AutoDraw pen" aria-pressed="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.7-10.7a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/><path d="M5 4v3M3.5 5.5h3"/></svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-button" id="undoButton" type="button" title="Undo" aria-label="Undo" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 14-4-4 4-4"/><path d="M5 10h8a6 6 0 0 1 6 6v1"/></svg>
        </button>
        <button class="tool-button" id="redoButton" type="button" title="Redo" aria-label="Redo" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 4-4-4-4"/><path d="M19 10h-8a6 6 0 0 0-6 6v1"/></svg>
        </button>
        <button class="tool-button" id="clearButton" type="button" title="Clear canvas" aria-label="Clear canvas" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 15H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <div class="toolbar-spacer"></div>
      </aside>

      <section class="canvas-shell">
        <div class="stage" id="stage">
          <div class="placed-layer" id="placedLayer" aria-hidden="true"></div>
          <canvas class="drawing-canvas" id="drawingCanvas" aria-label="Drawing canvas"></canvas>
        </div>
        <div class="style-dock" aria-label="Stroke style">
          <div class="swatches" role="group" aria-label="Ink color">
            <button class="swatch active" type="button" data-color="#17212b" style="--swatch:#17212b" title="Graphite" aria-label="Graphite ink" aria-pressed="true"></button>
            <button class="swatch" type="button" data-color="#007f7a" style="--swatch:#007f7a" title="Teal" aria-label="Teal ink" aria-pressed="false"></button>
            <button class="swatch" type="button" data-color="#d45443" style="--swatch:#d45443" title="Coral" aria-label="Coral ink" aria-pressed="false"></button>
            <button class="swatch" type="button" data-color="#2f6da1" style="--swatch:#2f6da1" title="Blue" aria-label="Blue ink" aria-pressed="false"></button>
          </div>
          <label class="size-control" title="Stroke width">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg>
            <input id="strokeWidth" type="range" min="2" max="14" step="1" value="5" aria-label="Stroke width">
          </label>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/drawing-app.mjs"></script>
</body>
</html>
